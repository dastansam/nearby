name: nearby
description: Offline payments relayed phone to phone, settled on NEAR Intents.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  crypto: ^3.0.3
  bs58: ^1.0.2
  convert: ^3.1.1
  sqflite: ^2.3.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  flutter_secure_storage: ^11.2.0
  nearby_connections: 4.3.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true
